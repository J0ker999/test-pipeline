name: DevSecOps Automated Security Scan

on:
  push:
    branches: [ "main" ]

jobs:
  container_audit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Run Trivy Security Scan
      uses: aquasecurity/trivy-action@0.28.0
      with:
        scan-type: 'config'
        format: 'table'
        exit-code: '1'
